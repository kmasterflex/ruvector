<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kids Sudoku 4×4 — Printable Series</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --line: #1a1a1a;
      --muted: #888;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(var(--muted) 1px, transparent 1.4px) 0 0 / 28px 28px,
        var(--paper);
    }

    /* ---- toolbar (hidden when printing) ---- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      padding: 14px 20px;
      background: #fffdf7;
      border-bottom: 2px solid var(--ink);
    }
    .toolbar h1 { font-size: 20px; margin: 0 16px 0 0; }
    .field { display: flex; flex-direction: column; font-size: 12px; gap: 4px; }
    .field select, .field input {
      font: inherit; font-size: 14px; padding: 4px 6px;
      border: 2px solid var(--ink); border-radius: 6px; background: #fff;
    }
    .toolbar button {
      font: inherit; font-weight: bold; cursor: pointer;
      padding: 8px 16px; border: 2px solid var(--ink);
      border-radius: 8px; background: #ffe14d;
    }
    .toolbar button:active { transform: translateY(1px); }
    .toolbar label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; }

    /* ---- pages ---- */
    .sheet { padding: 24px 20px 48px; }
    .sheet h2 { text-align: center; margin: 8px 0 4px; }
    .sheet p.sub { text-align: center; margin: 0 0 20px; color: #555; }

    .grid-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 28px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .puzzle { display: flex; flex-direction: column; align-items: center; }
    .puzzle .label { font-weight: bold; margin-bottom: 8px; }

    /* the board */
    .board {
      display: grid;
      grid-template-columns: repeat(4, 46px);
      grid-template-rows: repeat(4, 46px);
      /* thick wobbly hand-drawn outer frame */
      border: 4px solid var(--line);
      border-radius: 6px;
    }
    .cell {
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: bold;
      border-right: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
      background: rgba(255,255,255,0.65);
    }
    .cell:nth-child(4n) { border-right: none; }          /* last col */
    .cell:nth-child(n+13) { border-bottom: none; }       /* last row */
    /* thick 2x2 block dividers */
    .cell.block-right { border-right: 4px solid var(--line); }
    .cell.block-bottom { border-bottom: 4px solid var(--line); }
    .cell.given { color: var(--ink); }
    .cell.blank { color: var(--muted); }

    /* answer key */
    .answers { max-width: 1000px; margin: 40px auto 0; }
    .answers .board .cell { font-size: 20px; color: #c0392b; }
    .answers .grid-wrap { gap: 20px; }
    .answers .board { transform: scale(0.8); }

    .page-break { break-after: page; }

    @media print {
      .toolbar { display: none; }
      body { background: #fff; }
      .cell { background: #fff; }
      .sheet { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>🧩 Kids Sudoku 4×4</h1>
    <div class="field">
      <span>Difficulty</span>
      <select id="difficulty">
        <option value="easy">Easy (9 clues)</option>
        <option value="medium">Medium (7 clues)</option>
        <option value="hard">Hard (5 clues)</option>
      </select>
    </div>
    <div class="field">
      <span>How many puzzles</span>
      <input id="count" type="number" min="1" max="24" value="6" />
    </div>
    <div class="field">
      <span>Series seed</span>
      <input id="seed" type="number" value="12345" />
    </div>
    <label class="check"><input type="checkbox" id="showKey" checked /> Answer key</label>
    <button id="make">Make puzzles</button>
    <button id="print">🖨️ Print</button>
  </div>

  <div class="sheet">
    <h2>Sudoku 4×4 for Kids</h2>
    <p class="sub">Fill every row, every column and every 2×2 box with 1, 2, 3 and 4 — each number once!</p>
    <div class="grid-wrap" id="puzzles"></div>

    <div class="answers" id="answersWrap" hidden>
      <h2>Answer Key</h2>
      <div class="grid-wrap" id="answers"></div>
    </div>
  </div>

  <script src="sudoku4.js"></script>
  <script>
    // Mark cells that sit on a 2x2 block boundary so we can draw thick dividers.
    function boundaryClasses(i) {
      var row = (i / 4) | 0, col = i % 4, cls = [];
      if (col === 1) cls.push('block-right');   // between block columns
      if (row === 1) cls.push('block-bottom');  // between block rows
      return cls.join(' ');
    }

    function renderBoard(values, opts) {
      opts = opts || {};
      var board = document.createElement('div');
      board.className = 'board';
      values.forEach(function (v, i) {
        var cell = document.createElement('div');
        cell.className = 'cell ' + boundaryClasses(i) +
          (v ? ' given' : ' blank');
        cell.textContent = v ? v : '';
        board.appendChild(cell);
      });
      return board;
    }

    function build() {
      var difficulty = document.getElementById('difficulty').value;
      var count = Math.max(1, Math.min(24, +document.getElementById('count').value || 6));
      var seed = +document.getElementById('seed').value || 0;
      var showKey = document.getElementById('showKey').checked;

      var series = Sudoku4.generateSeries({ count: count, difficulty: difficulty, seed: seed });

      var puzzlesEl = document.getElementById('puzzles');
      var answersEl = document.getElementById('answers');
      puzzlesEl.innerHTML = '';
      answersEl.innerHTML = '';

      series.forEach(function (item) {
        var wrap = document.createElement('div');
        wrap.className = 'puzzle';
        var label = document.createElement('div');
        label.className = 'label';
        label.textContent = 'Puzzle ' + item.index;
        wrap.appendChild(label);
        wrap.appendChild(renderBoard(item.puzzle));
        puzzlesEl.appendChild(wrap);

        var awrap = document.createElement('div');
        awrap.className = 'puzzle';
        var alabel = document.createElement('div');
        alabel.className = 'label';
        alabel.textContent = 'Puzzle ' + item.index;
        awrap.appendChild(alabel);
        awrap.appendChild(renderBoard(item.solution));
        answersEl.appendChild(awrap);
      });

      document.getElementById('answersWrap').hidden = !showKey;
    }

    document.getElementById('make').addEventListener('click', build);
    document.getElementById('print').addEventListener('click', function () { window.print(); });
    build();
  </script>
</body>
</html>
